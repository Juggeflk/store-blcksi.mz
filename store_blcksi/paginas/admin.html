
<!DOCTYPE html>
<html lang="pt" class="admin-shell">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Administração — BLCKSI</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../styles/css/main.css?v=blcksi-admin-colors-20261116-2">
  <link rel="stylesheet" href="../styles/css/admin-panel.css?v=blcksi-admin-colors-20261116-2">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a href="index.html" class="admin-brand" aria-label="BLCKSI Back Office"><strong class="admin-logo-mark">BLK</strong><span class="admin-logo-name">BLCKSI<br>STORE</span><span class="admin-brand-label">BACK OFFICE</span></a>
      <a class="text-link" href="index.html">VOLTAR À LOJA</a>
    </div>
  </header>

  <main class="product-page">
    <div class="wrap admin-wrap">
      <div class="admin-heading"><div><p class="eyebrow">BLCKSI / GESTÃO DA MARCA</p><h1 class="cart-title">PAINEL DA LOJA</h1><p class="admin-subtitle">CONTROLO OPERACIONAL · COMERCIAL · FINANCEIRO</p></div><span class="admin-live"><i></i> SISTEMA DE GESTÃO</span></div>

      <section id="adminLogin" class="admin-card">
        <h2>ENTRAR</h2>
        <form id="loginForm">
          <label>Email
            <input name="email" type="email" required autocomplete="username">
          </label>
          <label>Palavra-passe
            <input name="password" type="password" required autocomplete="current-password">
          </label>
          <button class="btn btn-light" type="submit">ENTRAR NO PAINEL</button>
          <p id="loginMessage" class="cart-small"></p>
        </form>
      </section>

      <section id="adminPanel" hidden>
        <div class="archive-entry-link"><div><strong>BLCKSI ARCHIVE</strong><span>GESTÃO DO MUSEU DIGITAL</span></div><a href="archive-manager.html">ABRIR ARCHIVE MANAGER ↗</a></div>
        <div class="admin-tabs">
          <button data-tab="metrics" class="active">MÉTRICAS</button>
          <button data-tab="orders">ENCOMENDAS</button>
          <button data-tab="payments">PAGAMENTOS</button>
          <button data-tab="products">PRODUTOS</button>
          <button data-tab="categories">CATEGORIAS</button>
          <button id="adminLogout">SAIR</button>
        </div>
        <div id="adminContent"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../styles/js/supabase-config.js"></script>
  <script src="../styles/js/admin.js?v=blcksi-admin-js-fix2-20261116"></script>
  <script src="../styles/js/site-ui.js?v=blcksi-admin-colors-20261116-2"></script>
</body>
</html>
